# frontend image-এর ভেতরের nginx — শুধু static ফাইল। TLS/routing বাইরের Caddy করে।
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # hashed asset (index-BxHjsuqs.js) কখনো বদলায় না — দীর্ঘ cache নিরাপদ।
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html cache করা যাবে না, নইলে deploy-এর পরেও পুরোনো bundle দেখাবে।
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — এটা ছাড়া /chat refresh করলে 404।
    location / {
        try_files $uri $uri/ /index.html;
    }
}
